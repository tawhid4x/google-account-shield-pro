<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Vault Manager - Google Account Shield</title>
    <link rel="stylesheet" href="options.css">
</head>
<body>
    <div id="app" style="position: relative; width: 100vw; height: 100vh; overflow: hidden; background: #0b0d11; color: white; font-family: system-ui, sans-serif;">
        <!-- 3D Canvas Background -->
        <div id="canvas-container" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0;"></div>

        <!-- UI Overlay -->
        <div id="ui-layer" style="position: relative; z-index: 10; width: 100%; height: 100%; display: flex; flex-direction: column; padding: 40px; box-sizing: border-box; pointer-events: none;">
            <header style="pointer-events: auto; display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px;">
                <h1 style="margin: 0; font-size: 32px; background: linear-gradient(135deg, #fff 0%, #a5b4fc 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Omniverse Vault Manager</h1>
                <div>
                    <button id="btn-export" style="padding: 10px 20px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; border-radius: 8px; cursor: pointer; margin-right: 10px; backdrop-filter: blur(10px);">Export Vault (.gmas)</button>
                    <button id="btn-import" style="padding: 10px 20px; background: #3b82f6; border: none; color: white; border-radius: 8px; cursor: pointer; box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4);">Import Vault</button>
                </div>
            </header>

            <main style="flex: 1; pointer-events: auto; display: grid; grid-template-columns: 300px 1fr; gap: 40px;">
                <aside style="background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 24px; backdrop-filter: blur(20px);">
                    <h2 style="font-size: 18px; margin-top: 0; margin-bottom: 24px; color: #94a3b8;">Workspaces</h2>
                    <ul style="list-style: none; padding: 0; margin: 0; gap: 12px; display: flex; flex-direction: column;">
                        <li style="padding: 12px; background: rgba(34, 211, 238, 0.1); color: #22d3ee; border-radius: 8px; cursor: pointer; border: 1px solid rgba(34, 211, 238, 0.2);">All Accounts</li>
                        <li style="padding: 12px; color: #e2e8f0; border-radius: 8px; cursor: pointer; transition: background 0.2s;">Personal</li>
                        <li style="padding: 12px; color: #e2e8f0; border-radius: 8px; cursor: pointer; transition: background 0.2s;">Work & Clients</li>
                        <li style="padding: 12px; color: #e2e8f0; border-radius: 8px; cursor: pointer; transition: background 0.2s;">Gaming & YT</li>
                    </ul>
                </aside>

                <section style="background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 24px; backdrop-filter: blur(20px); overflow-y: auto;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
                        <h2 style="font-size: 18px; margin: 0; color: #e2e8f0;">Active Vault <span id="account-count" style="background: rgba(255,255,255,0.1); padding: 2px 8px; border-radius: 12px; font-size: 14px; margin-left: 8px;">0</span></h2>
                        <input type="text" placeholder="Search by name, email, tags..." style="padding: 10px 16px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.2); color: white; width: 300px; outline: none;">
                    </div>

                    <div id="account-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px;">
                        <!-- Accounts injected here -->
                    </div>
                </section>
            </main>
        </div>
    </div>

    <!-- Hidden File Input for Import -->
    <input type="file" id="file-import" style="display: none;" accept=".gmas,.json">

    <script src="options.js" type="module"></script>
</body>
</html>
