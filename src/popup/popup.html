<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div id="app" style="position: relative; width: 100%; height: 100%; overflow: hidden;">
        <!-- 3D Canvas Background -->
        <div id="canvas-container" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;"></div>

        <!-- UI Overlay -->
        <div id="ui-layer" style="position: relative; z-index: 10; padding: 20px;">
            <h2 style="margin: 0 0 10px 0; font-size: 18px; font-weight: 600;">Google Account Shield</h2>
            <div id="status-badge" style="display: inline-block; padding: 4px 8px; border-radius: 4px; background: rgba(34, 211, 238, 0.2); color: #22d3ee; font-size: 12px; font-weight: 600; margin-bottom: 20px;">
                Shield Active
            </div>

            <div class="toggle-row" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <span style="font-size: 14px;">Hide "Sign Out" Button</span>
                <label class="switch">
                    <input type="checkbox" id="toggle-hide" checked>
                    <span class="slider round"></span>
                </label>
            </div>

            <div class="stats-card" style="background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; padding: 15px; margin-bottom: 20px; backdrop-filter: blur(10px);">
                <div style="font-size: 12px; color: #94a3b8; margin-bottom: 5px;">Accounts in Vault</div>
                <div id="account-count" style="font-size: 24px; font-weight: bold; color: #fff;">0</div>
            </div>

            <button id="btn-options" style="width: 100%; padding: 10px; background: #3b82f6; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; transition: background 0.2s;">
                Open Vault Manager
            </button>
        </div>
    </div>
    <script src="popup.js" type="module"></script>
</body>
</html>
