<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Google Multi-Account Shield</title>
    <link rel="stylesheet" href="popup.css">
    <style>
        body { margin: 0; width: 360px; height: 500px; background: #111; color: #fff; font-family: sans-serif; overflow: hidden; }
        #app { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
        .ui-layer { position: relative; z-index: 2; padding: 20px; }
        h1 { font-size: 18px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div id="app"></div>
    <div class="ui-layer">
        <h1>Google Account Shield</h1>
        <p>Active Status: Protected</p>
    </div>
    <script src="popup.js" type="module"></script>
</body>
</html>
